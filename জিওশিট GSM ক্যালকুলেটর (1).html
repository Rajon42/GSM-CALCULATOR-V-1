<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>জিওশিট GSM ক্যালকুলেটর</title>
<style>
:root{
  --bg:#f3f5f2; --card:#ffffff; --ink:#1b2a22; --muted:#5d6b63;
  --line:#cfd8d2; --accent:#1f6b4a; --accent-ink:#ffffff; --result:#e4f1ea;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121a16; --card:#1b2621; --ink:#e8f0eb; --muted:#9db0a5;
    --line:#33433a; --accent:#4fb985; --accent-ink:#0c1a13; --result:#223a2e;
    color-scheme: dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Noto Sans Bengali","Hind Siliguri",system-ui,-apple-system,"Segoe UI",sans-serif;
  line-height:1.5; padding:20px 16px 40px;
}
main{max-width:460px;margin:0 auto}
h1{font-size:1.4rem;margin:8px 0 4px}
p.sub{margin:0 0 18px;color:var(--muted);font-size:.95rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
.row{display:flex;gap:10px;margin-bottom:14px}
.field{flex:1;min-width:0}
label{display:block;font-size:.95rem;margin-bottom:6px;font-weight:600}
input,select{
  width:100%;font:inherit;color:var(--ink);background:var(--bg);
  border:1px solid var(--line);border-radius:8px;padding:12px;
}
input:focus,select:focus,button:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.unit{flex:0 0 38%}
button{
  width:100%;font:inherit;font-weight:700;padding:13px;border-radius:8px;
  border:0;background:var(--accent);color:var(--accent-ink);cursor:pointer;
}
button.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);margin-top:8px;font-weight:500}
#out{margin-top:16px;background:var(--result);border-radius:10px;padding:16px;text-align:center;min-height:84px}
#out .num{font-size:2.4rem;font-weight:800;line-height:1.1}
#out .lbl{color:var(--muted);font-size:.9rem}
#out .err{color:var(--ink)}
.note{margin-top:14px;color:var(--muted);font-size:.85rem}
</style>
</head>
<body>
<main>
  <h1>জিওশিট GSM ক্যালকুলেটর</h1>
  <p class="sub">ওজন, লম্বা আর চওড়া দিন — GSM নিজে থেকেই বের হবে।</p>

  <div class="card">
    <div class="row">
      <div class="field">
        <label for="w">ওজন</label>
        <input id="w" type="number" inputmode="decimal" min="0" step="any" placeholder="যেমন: 1200">
      </div>
      <div class="field unit">
        <label for="wu">একক</label>
        <select id="wu">
          <option value="1">গ্রাম (g)</option>
          <option value="1000">কেজি (kg)</option>
        </select>
      </div>
    </div>

    <div class="row">
      <div class="field">
        <label for="l">লম্বা</label>
        <input id="l" type="number" inputmode="decimal" min="0" step="any" placeholder="যেমন: 1">
      </div>
      <div class="field unit">
        <label for="lu">একক</label>
        <select id="lu">
          <option value="1">মিটার (m)</option>
          <option value="0.01">সেমি (cm)</option>
          <option value="0.0254">ইঞ্চি (in)</option>
          <option value="0.3048">ফুট (ft)</option>
        </select>
      </div>
    </div>

    <div class="row">
      <div class="field">
        <label for="d">চওড়া</label>
        <input id="d" type="number" inputmode="decimal" min="0" step="any" placeholder="যেমন: 1">
      </div>
      <div class="field unit">
        <label for="du">একক</label>
        <select id="du">
          <option value="1">মিটার (m)</option>
          <option value="0.01">সেমি (cm)</option>
          <option value="0.0254">ইঞ্চি (in)</option>
          <option value="0.3048">ফুট (ft)</option>
        </select>
      </div>
    </div>

    <button id="go" type="button">GSM বের করুন</button>
    <button id="clear" type="button" class="ghost">মুছে ফেলুন</button>

    <div id="out" aria-live="polite">
      <div class="lbl">ফলাফল এখানে দেখাবে</div>
    </div>
  </div>

  <p class="note">সূত্র: GSM = ওজন (গ্রাম) ÷ [লম্বা (মি) × চওড়া (মি)]। অর্থাৎ প্রতি বর্গমিটারে কত গ্রাম।</p>
</main>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var bn = "০১২৩৪৫৬৭৮৯";
  function toBn(s){ return String(s).replace(/[0-9]/g, function(d){ return bn[d]; }); }

  function calc(){
    var w = parseFloat($("w").value), l = parseFloat($("l").value), d = parseFloat($("d").value);
    var out = $("out");
    if (!(w > 0) || !(l > 0) || !(d > 0)) {
      out.innerHTML = '<div class="err">তিনটি ঘরেই শূন্যের চেয়ে বড় সংখ্যা দিন।</div>';
      return;
    }
    var grams = w * parseFloat($("wu").value);
    var lm = l * parseFloat($("lu").value);
    var dm = d * parseFloat($("du").value);
    var gsm = grams / (lm * dm);
    var shown = (Math.round(gsm * 100) / 100).toLocaleString("en-US", {maximumFractionDigits: 2});
    out.innerHTML = '<div class="num">' + toBn(shown) + '</div><div class="lbl">GSM (গ্রাম/বর্গমিটার)</div>';
  }

  $("go").addEventListener("click", calc);
  ["w","l","d"].forEach(function(id){
    $(id).addEventListener("keydown", function(e){ if (e.key === "Enter") calc(); });
  });
  $("clear").addEventListener("click", function(){
    ["w","l","d"].forEach(function(id){ $(id).value = ""; });
    $("out").innerHTML = '<div class="lbl">ফলাফল এখানে দেখাবে</div>';
    $("w").focus();
  });
})();
</script>
</body>
</html>
